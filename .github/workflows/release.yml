name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        required: true
        type: string
      notify_telegram:
        description: "发布后同步到 Telegram"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=betterheybox\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          else
            echo "No KEYSTORE_BASE64 secret - building unsigned APK"
          fi

      - name: Validate release version and prepare notes
        id: release_meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "版本号必须是 vX.X.X，例如 v0.3.1；实际收到: $INPUT_VERSION" >&2
            exit 1
          fi

          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "标签 ${tag} 已存在，请填写新的版本号" >&2
            exit 1
          fi

          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ -n "$latest_tag" ]; then
            latest_version="${latest_tag#v}"
            highest_version="$(printf '%s\n' "$latest_version" "$version" | sort -V | tail -n 1)"
            if [ "$highest_version" != "$version" ]; then
              echo "新版本 ${tag} 必须高于当前版本 ${latest_tag}" >&2
              exit 1
            fi
          fi

          previous_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi
          repo_url="https://github.com/${GITHUB_REPOSITORY}"

          changelog="$(awk -v v="$version" '
            $0 ~ "^##[[:space:]]+" v "[[:space:]]*$" { found = 1; next }
            found && $0 ~ "^##[[:space:]]" { exit }
            found { print }
          ' CHANGELOG.md | awk 'NF { started = 1 } started')"
          if [ -n "$changelog" ]; then
            has_changelog=true
          else
            has_changelog=false
          fi

          {
            echo "## 更新内容"
            echo
            if [ "$has_changelog" = "true" ]; then
              printf '%s\n' "$changelog"
            else
              git log "$range" -n 50 --pretty=format:'- %h %s'
              echo
            fi
            echo
            echo "## 提交记录"
            echo
            git log "$range" -n 50 --pretty=format:"- [%h](${repo_url}/commit/%H) %s"
            echo
          } > release-notes.md

          # Android versionCode stays numeric and increases with semantic version.
          IFS='.' read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "version=v${version}" >> "$GITHUB_OUTPUT"
          echo "version_name=v${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          echo "has_changelog=${has_changelog}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            --project-prop VERSION_NAME="${{ steps.release_meta.outputs.version_name }}" \
            --project-prop VERSION_CODE="${{ steps.release_meta.outputs.version_code }}"

      - name: Prepare release artifact
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/BetterHeybox-${RELEASE_VERSION}.apk"
          sha256sum dist/*.apk

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: BetterHeybox-${{ steps.release_meta.outputs.version }}
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.version }}
          body_path: release-notes.md
          files: dist/*.apk
          draft: false
          prerelease: false

      - name: Build Telegram message
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.release_meta.outputs.previous_tag }}
          HAS_CHANGELOG: ${{ steps.release_meta.outputs.has_changelog }}
        run: |
          set -euo pipefail
          export LC_ALL="${LC_ALL:-C.UTF-8}"

          escape_html() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          release_url="${repo_url}/releases/tag/${RELEASE_TAG}"
          apk="dist/BetterHeybox-${RELEASE_VERSION}.apk"
          size_bytes="$(wc -c < "$apk" | tr -d '[:space:]')"
          size_human="$(awk -v b="$size_bytes" 'BEGIN { printf "%.2f MB", b / 1048576 }')"
          sha256="$(sha256sum "$apk" | cut -d' ' -f1)"

          if [ -n "$PREVIOUS_TAG" ]; then
            range="${PREVIOUS_TAG}..HEAD"
          else
            range="HEAD"
          fi
          commit_total="$(git rev-list --count "$range")"

          # CHANGELOG 小节转成 Telegram HTML：转义 → 去掉 ** → ### 小标题加粗
          changelog=""
          if [ "$HAS_CHANGELOG" = "true" ]; then
            changelog="$(awk -v v="${RELEASE_VERSION#v}" '
              $0 ~ "^##[[:space:]]+" v "[[:space:]]*$" { found = 1; next }
              found && $0 ~ "^##[[:space:]]" { exit }
              found { print }
            ' CHANGELOG.md \
              | awk 'NF { started = 1 } started' \
              | escape_html \
              | sed -e 's/\*\*//g' -e 's|^###[[:space:]]*\(.*\)$|▪ <b>\1</b>|')"
          fi

          # 只发一条消息：正文即 APK 的 caption（可见字符上限约 1000），
          # 给更新日志留固定预算，保证提交记录也能露出来；两者都可能被脚本按行截断
          changelog_budget=420
          if [ -n "$changelog" ] && [ "${#changelog}" -gt "$changelog_budget" ]; then
            changelog="${changelog:0:$changelog_budget}"
            changelog="${changelog%$'\n'*}"
            changelog="${changelog}"$'\n'"…（完整更新日志见 Release 说明）"
          fi

          {
            printf '🚀 <b>BetterHeybox %s</b> · %s\n' "$RELEASE_VERSION" "$size_human"
            printf 'SHA-256: <code>%s</code>\n' "$sha256"
            printf 'Release: <a href="%s">%s</a>\n' "$release_url" "$RELEASE_TAG"
            printf '\n📋 <b>更新日志</b>\n'
            if [ -n "$changelog" ]; then
              printf '%s\n' "$changelog"
            else
              printf '本次共 %s 个提交，详见下方提交记录。\n' "$commit_total"
            fi
            printf '\n🔗 <b>提交记录</b>\n'
            if [ "$commit_total" -gt 0 ]; then
              git log "$range" -n 3 --pretty=format:'%H|%s' | while IFS='|' read -r sha subject; do
                if [ "${#subject}" -gt 60 ]; then
                  subject="${subject:0:60}…"
                fi
                printf '• <a href="%s/commit/%s">%s</a> %s\n' \
                  "$repo_url" "$sha" "${sha:0:7}" "$(printf '%s' "$subject" | escape_html)"
              done
              printf '\n'
              if [ "$commit_total" -gt 3 ]; then
                printf '…另有 %s 条提交，见 <a href="%s">Release 说明</a>\n' "$((commit_total - 3))" "$release_url"
              fi
            else
              printf '（没有可列出的提交）\n'
            fi
          } > telegram-message.html

      - name: Notify Telegram
        continue-on-error: true
        env:
          NOTIFY_TELEGRAM: ${{ inputs.notify_telegram }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # boolean 输入在 env 里是 "true"/"false" 字符串，避免在 if 里做类型猜测
          if [ "$NOTIFY_TELEGRAM" = "false" ]; then
            echo "::notice::notify_telegram=false，跳过 Telegram 通知"
            exit 0
          fi
          bash .github/scripts/telegram-notify.sh \
            --message telegram-message.html \
            --document "dist/BetterHeybox-${{ steps.release_meta.outputs.version }}.apk"
