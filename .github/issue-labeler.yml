# Auto-label rules for github/issue-labeler.
# Go regexp (RE2), case-insensitive via (?i). Both title and body are scanned.
# A matching label is added; with sync-labels=1 it is also removed when no
# rule matches after an edit. Manually added labels outside this file are untouched.
bug:
  - any:
      - '(?i)\bbug\b'
      - '崩溃|闪退|白屏|黑屏|卡死|卡住|无响应|死机'
      - '报错|出错|错误|异常|坏掉'
      - '失效|不生效|没效果|无效果|不起作用|没有反应|没反应|用不了'
      - '无法|下载失败|安装失败|登录失败|恢复失败'
      - '(?i)crash|freeze|frozen|broken|not work|error|fail(ure|ed|ing)?'

enhancement:
  - any:
      - '希望|建议|期待|需求|提议|能否|可否|能不能|可不可以|求支持|支持一下'
      - '新增|新功能|增加|添加|适配|优化'
      - '(?i)feature (request|suggestion)|it would be (nice|great)|please (add|support)'

question:
  - any:
      - '请问|想问|想知道|咨询|帮我看'
      - '怎么|如何|为什么|什么原因|什么情况|啥情况|啥原因|是不是|有没有|是否'
      - '(?i)how (do|to|can)|why (is|does|do)|\bquestion\b'

accessibility:
  - any:
      - '无障碍|读屏|盲人|视障|低视力|色盲|色弱|TalkBack'
      - '(?i)accessib|talkback|screen reader'
